name: GraalVM Metadata Check

on:
  pull_request:
    paths:
      - 'kubernetes-client/src/main/**'
      - 'kubernetes-client/pom.xml'
      - 'kubernetes-client/src/main/resources/META-INF/native-image/**'
      - 'openshift-client/src/main/**'
      - 'openshift-client/pom.xml'
      - 'openshift-client/src/main/resources/META-INF/native-image/**'
  push:
    branches:
      - main
    paths:
      - 'kubernetes-client/src/main/**'
      - 'kubernetes-client/pom.xml'
      - 'kubernetes-client/src/main/resources/META-INF/native-image/**'
      - 'openshift-client/src/main/**'
      - 'openshift-client/pom.xml'
      - 'openshift-client/src/main/resources/META-INF/native-image/**'
  workflow_dispatch:

jobs:
  verify-metadata:
    name: Verify ${{ matrix.module }} Metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - kubernetes-client
          - openshift-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '11'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make scripts executable
        run: |
          chmod +x ${{ matrix.module }}/verify-graalvm-metadata.sh
          chmod +x ${{ matrix.module }}/generate-graalvm-metadata.sh

      - name: Verify GraalVM metadata is up-to-date
        run: |
          cd ${{ matrix.module }}
          ./verify-graalvm-metadata.sh

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-diff-${{ matrix.module }}
          path: ${{ matrix.module }}/target/metadata-diff/
          retention-days: 7

      - name: Comment on PR (if metadata changed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **GraalVM Metadata Check Failed - ${{ matrix.module }}**\n\n' +
                    'The committed GraalVM native-image metadata is out of sync with the current code.\n\n' +
                    '**To fix:**\n' +
                    '1. Run `cd ${{ matrix.module }} && ./generate-graalvm-metadata.sh`\n' +
                    '2. Review the generated metadata changes\n' +
                    '3. Commit and push the updated metadata files\n\n' +
                    'Check the workflow artifacts for detailed diff files.'
            })
